<style>.ibob,.ishadow{transform-box:fill-box;transform-origin:50% 50%}@keyframes ib{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2px)}}@keyframes isd{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.86);opacity:.22}}@keyframes is{0%,55%{transform:translateX(0)}100%{transform:translateX(78px)}}@keyframes ig{0%,100%{opacity:.9}50%{opacity:1}}.ibob{animation:ib 4.2s ease-in-out infinite}.ishadow{animation:isd 4.2s ease-in-out infinite}.ishine{animation:is 5.5s ease-in-out infinite}.iglow{animation:ig 4.2s ease-in-out infinite}.sp{transform-box:fill-box;transform-origin:50% 50%;animation:tw 3.2s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15;transform:scale(.4) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
